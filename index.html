<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<style>
  /* ===== WINDOWS XP LUNA THEME ===== */
  :root {
    --bg: #ece9d8;
    --surface: #ece9d8;
    --surface-hover: #ddd8ca;
    --border: #0a246a;
    --accent: #316ac5;
    --text: #000000;
    --text-dim: #444444;
    --icon-size: 36px;
    --zone-gap: 24px;
    --zone-padding: 8px;
    --grid-gap: 4px;
    --shortcut-width: 72px;
    --label-size: 10px;
    --zone-radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Tahoma, 'MS Sans Serif', Arial, sans-serif;
    /* Bliss wallpaper gradient */
    background:
      linear-gradient(to bottom,
        #7ec8e3 0%,
        #5ab5dc 30%,
        #4aa8d0 48%,
        #68bc44 52%,
        #4fa02c 65%,
        #2d7515 80%,
        #1a5508 100%
      );
    background-attachment: fixed;
    background-size: 100% 100%;
    color: var(--text);
    min-height: 100vh;
    padding: 40px 32px 60px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Settings button — XP toolbar button */
  #settings-btn {
    position: fixed;
    top: 8px;
    right: 8px;
    z-index: 300;
    width: 34px;
    height: 26px;
    background: linear-gradient(to bottom, #f5f3ee 0%, #ddd8cc 100%);
    border: 1px solid;
    border-color: #ffffff #7b9ebd #7b9ebd #ffffff;
    color: #000;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
    border-radius: 3px;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
  }
  #settings-btn:hover {
    background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%);
    border-color: #316ac5;
  }
  #settings-btn:active {
    background: linear-gradient(to bottom, #a8c8f0 0%, #dde9f8 100%);
    box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2);
  }

  /* Settings panel — XP window panel */
  #settings-panel {
    position: fixed;
    top: 0;
    right: -360px;
    width: 340px;
    max-width: 90vw;
    height: 100vh;
    background: #ece9d8;
    border-left: 2px solid #0a246a;
    z-index: 350;
    transition: right 0.25s ease;
    overflow-y: auto;
    padding: 0;
  }
  #settings-panel.open { right: 0; }

  #settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 340;
  }
  #settings-overlay.open { display: block; }

  /* Settings header — XP title bar */
  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to right, #0a246a 0%, #1254a4 20%, #2d84e0 55%, #6db5f5 82%, #c4e4fc 100%);
    padding: 5px 6px 5px 10px;
  }
  .settings-header h3 {
    font-size: 12px;
    font-weight: bold;
    color: white;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
  }
  .settings-close {
    background: linear-gradient(to bottom, #f2ede6 0%, #c8bfb5 100%);
    border: 1px solid;
    border-color: #ffffff #7b9ebd #7b9ebd #ffffff;
    color: #000;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    padding: 0;
    width: 21px;
    height: 19px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 1px 1px 1px rgba(0,0,0,0.2);
    line-height: 1;
  }
  .settings-close:hover {
    background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%);
    border-color: #316ac5;
  }

  .setting-group { margin: 12px 16px 0; }
  .setting-group-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #316ac5;
    margin-bottom: 8px;
    font-weight: bold;
    border-bottom: 1px solid #7b9ebd;
    padding-bottom: 4px;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .setting-row label { font-size: 11px; color: #000; }
  .setting-row input[type="range"] { width: 120px; accent-color: #316ac5; }
  .setting-row input[type="color"] {
    width: 32px; height: 22px;
    border: 1px solid #7b9ebd;
    border-radius: 2px;
    cursor: pointer;
    padding: 0;
  }
  .setting-value {
    font-size: 11px;
    color: #000;
    min-width: 32px;
    text-align: right;
    margin-left: 6px;
  }

  .settings-actions {
    display: flex;
    gap: 6px;
    margin: 16px;
    padding-top: 12px;
    border-top: 1px solid #7b9ebd;
  }
  .settings-actions button {
    flex: 1;
    padding: 5px 8px;
    background: linear-gradient(to bottom, #f5f3ee 0%, #ddd8cc 100%);
    border: 1px solid;
    border-color: #ffffff #7b9ebd #7b9ebd #ffffff;
    border-radius: 3px;
    font-size: 11px;
    font-family: Tahoma, sans-serif;
    cursor: pointer;
    color: #000;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.15);
  }
  .btn-export:hover, .btn-import:hover { background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%); border-color: #316ac5; }
  .btn-reset { color: #990000; }
  .btn-reset:hover { background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%); border-color: #316ac5; color: #990000; }

  /* Zones container */
  #zones-container {
    display: flex;
    flex-wrap: wrap;
    gap: var(--zone-gap);
    justify-content: center;
    max-width: 1400px;
    width: 100%;
  }

  /* Zone = XP Window */
  .zone {
    background: #ece9d8;
    border: 2px solid #0a246a;
    border-radius: var(--zone-radius) var(--zone-radius) 4px 4px;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.4), inset 0 0 0 1px #a6caf0;
    padding: 0;
    overflow: hidden;
    min-width: 0;
    position: relative;
  }

  /* Zone header = XP title bar */
  .zone-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to right, #0a246a 0%, #1254a4 20%, #2d84e0 55%, #6db5f5 82%, #c4e4fc 100%);
    padding: 3px 4px 3px 8px;
    gap: 6px;
    border-radius: calc(var(--zone-radius) - 2px) calc(var(--zone-radius) - 2px) 0 0;
    user-select: none;
  }

  .zone-title {
    font-size: 12px;
    font-weight: bold;
    text-transform: none;
    letter-spacing: normal;
    cursor: text;
    border: none;
    background: none;
    color: white;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    font-family: Tahoma, sans-serif;
    outline: none;
    width: 100%;
  }
  .zone-title::placeholder { color: rgba(255,255,255,0.6); }

  .zone-actions {
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .zone:hover .zone-actions { opacity: 1; }

  .zone-actions button {
    background: linear-gradient(to bottom, #f2ede6 0%, #c8bfb5 100%);
    border: 1px solid;
    border-color: #ffffff #7b9ebd #7b9ebd #ffffff;
    color: #000;
    cursor: pointer;
    font-size: 11px;
    padding: 0;
    width: 19px;
    height: 17px;
    border-radius: 2px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 1px 1px 1px rgba(0,0,0,0.2);
  }
  .zone-actions button:hover {
    background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%);
    border-color: #316ac5;
  }

  /* Zone grid — window body with padding */
  .zone-grid {
    display: grid;
    gap: var(--grid-gap);
    padding: var(--zone-padding);
    background: #ece9d8;
  }

  .shortcut {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #000;
    padding: 8px 6px;
    border-radius: 3px;
    transition: background 0.1s;
    width: var(--shortcut-width);
    cursor: pointer;
    position: relative;
  }
  .shortcut:hover {
    background: rgba(49,106,197,0.15);
    outline: 1px dotted #316ac5;
  }

  .shortcut-icon {
    width: var(--icon-size);
    height: var(--icon-size);
    border-radius: 3px;
    background: #d4d0c8;
    border: 1px solid;
    border-color: #ffffff #808080 #808080 #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 4px;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
  }
  .shortcut-icon img {
    width: calc(var(--icon-size) - 10px);
    height: calc(var(--icon-size) - 10px);
    object-fit: contain;
  }

  .shortcut-label {
    font-size: var(--label-size);
    color: #000;
    text-align: center;
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.2;
    font-family: Tahoma, sans-serif;
  }

  .shortcut-options-btn {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    background: linear-gradient(to bottom, #f5f3ee 0%, #ddd8cc 100%);
    border: 1px solid;
    border-color: #fff #7b9ebd #7b9ebd #fff;
    color: #000;
    font-size: 10px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
    border-radius: 2px;
  }
  .shortcut:hover .shortcut-options-btn { display: flex; }
  .shortcut-options-btn:hover {
    background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%);
    border-color: #316ac5;
  }

  .add-shortcut {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: var(--shortcut-width);
    padding: 8px 6px;
    border-radius: 3px;
    border: 1px dashed #7b9ebd;
    background: none;
    color: #444;
    cursor: pointer;
    transition: all 0.1s;
    font-family: Tahoma, sans-serif;
  }
  .add-shortcut:hover {
    border-color: #316ac5;
    color: #316ac5;
    background: rgba(49,106,197,0.08);
  }
  .add-shortcut-icon {
    width: var(--icon-size);
    height: var(--icon-size);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-bottom: 4px;
  }
  .add-shortcut-label { font-size: var(--label-size); }

  /* Add Zone — XP default button (bold border = default) */
  #add-zone-btn {
    margin-top: 24px;
    padding: 6px 20px;
    background: linear-gradient(to bottom, #f5f3ee 0%, #ddd8cc 100%);
    border: 2px solid #316ac5;
    border-radius: 3px;
    color: #000;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.1s;
    font-family: Tahoma, sans-serif;
    box-shadow: 1px 1px 3px rgba(0,0,0,0.25);
  }
  #add-zone-btn:hover {
    background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%);
    border-color: #316ac5;
  }
  #add-zone-btn:active {
    background: linear-gradient(to bottom, #a8c8f0 0%, #dde9f8 100%);
    box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2);
  }

  /* Modal overlay */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }

  /* Modal = XP dialog window */
  .modal {
    background: #ece9d8;
    border: 2px solid #0a246a;
    border-radius: var(--zone-radius) var(--zone-radius) 4px 4px;
    box-shadow: 4px 4px 20px rgba(0,0,0,0.5), inset 0 0 0 1px #a6caf0;
    padding: 14px 20px 20px;
    width: 340px;
    max-width: 90vw;
    overflow: hidden;
  }
  .modal h3 {
    background: linear-gradient(to right, #0a246a 0%, #1254a4 20%, #2d84e0 55%, #6db5f5 82%, #c4e4fc 100%);
    color: white;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    font-size: 12px;
    font-weight: bold;
    font-family: Tahoma, sans-serif;
    padding: 5px 20px;
    margin: -14px -20px 16px;
    border-radius: calc(var(--zone-radius) - 2px) calc(var(--zone-radius) - 2px) 0 0;
  }
  .modal label {
    display: block;
    font-size: 11px;
    color: #000;
    margin-bottom: 3px;
    margin-top: 10px;
    font-family: Tahoma, sans-serif;
  }
  .modal label:first-of-type { margin-top: 0; }
  .modal input {
    width: 100%;
    padding: 4px 6px;
    background: #ffffff;
    border: 2px solid;
    border-color: #7f9db9 #ffffff #ffffff #7f9db9;
    color: #000;
    font-size: 12px;
    font-family: Tahoma, sans-serif;
    outline: none;
    border-radius: 0;
  }
  .modal input:focus { border-color: #316ac5; }
  .modal-row { display: flex; gap: 10px; }
  .modal-row > div { flex: 1; }
  .modal-buttons {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
    margin-top: 16px;
  }
  .modal-buttons button {
    padding: 5px 16px;
    background: linear-gradient(to bottom, #f5f3ee 0%, #ddd8cc 100%);
    border: 1px solid;
    border-color: #ffffff #7b9ebd #7b9ebd #ffffff;
    border-radius: 3px;
    font-size: 11px;
    font-family: Tahoma, sans-serif;
    cursor: pointer;
    color: #000;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    min-width: 75px;
  }
  .btn-cancel:hover { background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%); border-color: #316ac5; }
  /* Confirm = default button (bold border) */
  .btn-confirm { border: 2px solid #316ac5; }
  .btn-confirm:hover { background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%); }

  /* Context menu — XP popup menu */
  .ctx-menu {
    display: none;
    position: fixed;
    background: #ece9d8;
    border: 1px solid #7b9ebd;
    border-radius: 0;
    padding: 2px;
    z-index: 200;
    min-width: 160px;
    box-shadow: 3px 3px 6px rgba(0,0,0,0.3);
  }
  .ctx-menu.active { display: block; }
  .ctx-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: #000;
    padding: 4px 20px;
    font-size: 11px;
    cursor: pointer;
    border-radius: 0;
    font-family: Tahoma, sans-serif;
  }
  .ctx-menu button:hover { background: #316ac5; color: white; }
  .ctx-menu button.danger { color: #990000; }
  .ctx-menu button.danger:hover { background: #316ac5; color: white; }
  .ctx-menu hr { border: none; border-top: 1px solid #7b9ebd; margin: 2px 4px; }

  #icon-file-input, #import-file-input { display: none; }

  /* Clock widget */
  #clock-widget {
    text-align: center;
    margin-bottom: 24px;
    user-select: none;
  }
  #clock-time {
    font-size: 52px;
    font-weight: bold;
    letter-spacing: 2px;
    color: white;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.7), 0 0 20px rgba(0,0,0,0.3);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    font-family: Tahoma, sans-serif;
  }
  #clock-date {
    font-size: 14px;
    color: white;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
    margin-top: 6px;
    letter-spacing: 0.5px;
    font-family: Tahoma, sans-serif;
  }

  /* Search bar — XP sunken input */
  #search-container {
    width: 100%;
    max-width: 540px;
    margin-bottom: 32px;
    position: relative;
  }
  #search-input {
    width: 100%;
    padding: 6px 42px 6px 10px;
    background: #ffffff;
    border: 2px solid;
    border-color: #7f9db9 #ffffff #ffffff #7f9db9;
    color: #000;
    font-size: 12px;
    font-family: Tahoma, sans-serif;
    outline: none;
    transition: border-color 0.1s;
    border-radius: 0;
  }
  #search-input:focus {
    border-color: #316ac5;
    box-shadow: 0 0 0 1px #316ac5;
  }
  #search-input::placeholder { color: #7b9ebd; }

  #search-hint {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: #7b9ebd;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    font-family: Tahoma, sans-serif;
  }
  #search-input:not(:placeholder-shown) ~ #search-hint { opacity: 1; }

  .shortcut.search-hidden { display: none; }
  .shortcut.search-dim { opacity: 0.3; }
  .shortcut.search-match {
    outline: 2px solid #316ac5;
    outline-offset: 2px;
    background: rgba(49,106,197,0.15);
  }

  /* ===== AUTH MODAL ===== */
  #auth-container {
    display: flex;
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, #7ec8e3 0%, #5ab5dc 30%, #4aa8d0 48%, #68bc44 52%, #4fa02c 65%, #2d7515 80%, #1a5508 100%);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  #auth-container.hidden { display: none; }

  #auth-panel {
    background: #ece9d8;
    border: 2px solid #0a246a;
    border-radius: 8px 8px 4px 4px;
    box-shadow: 4px 4px 20px rgba(0,0,0,0.5), inset 0 0 0 1px #a6caf0;
    padding: 14px 20px 20px;
    width: 340px;
    max-width: 90vw;
    overflow: hidden;
  }

  #auth-panel h2 {
    background: linear-gradient(to right, #0a246a 0%, #1254a4 20%, #2d84e0 55%, #6db5f5 82%, #c4e4fc 100%);
    color: white;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    font-size: 14px;
    font-weight: bold;
    font-family: Tahoma, sans-serif;
    padding: 5px 20px;
    margin: -14px -20px 16px;
    border-radius: 6px 6px 0 0;
  }

  #auth-panel label {
    display: block;
    font-size: 11px;
    color: #000;
    margin-bottom: 3px;
    margin-top: 10px;
    font-family: Tahoma, sans-serif;
  }
  #auth-panel label:first-of-type { margin-top: 0; }

  #auth-panel input {
    width: 100%;
    padding: 4px 6px;
    background: #ffffff;
    border: 2px solid;
    border-color: #7f9db9 #ffffff #ffffff #7f9db9;
    color: #000;
    font-size: 12px;
    font-family: Tahoma, sans-serif;
    outline: none;
    border-radius: 0;
    margin-bottom: 10px;
  }
  #auth-panel input:focus { border-color: #316ac5; }

  #auth-error {
    background: #ffeaea;
    border: 1px solid #d4a8a8;
    color: #990000;
    padding: 8px 10px;
    margin-bottom: 12px;
    font-size: 11px;
    border-radius: 2px;
    display: none;
  }
  #auth-error.show { display: block; }

  #auth-buttons {
    display: flex;
    gap: 6px;
    margin-top: 16px;
  }

  #auth-buttons button {
    flex: 1;
    padding: 5px 16px;
    background: linear-gradient(to bottom, #f5f3ee 0%, #ddd8cc 100%);
    border: 1px solid;
    border-color: #ffffff #7b9ebd #7b9ebd #ffffff;
    border-radius: 3px;
    font-size: 11px;
    font-family: Tahoma, sans-serif;
    cursor: pointer;
    color: #000;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    min-width: 75px;
  }
  #auth-buttons button:hover {
    background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%);
    border-color: #316ac5;
  }

  #auth-buttons button:active {
    background: linear-gradient(to bottom, #a8c8f0 0%, #dde9f8 100%);
    box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2);
  }

  #auth-loading {
    text-align: center;
    font-size: 11px;
    color: #444;
  }

  /* ===== XP TASKBAR ===== */
  #xp-taskbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30px;
    background: linear-gradient(to bottom,
      #245fd8 0%,
      #2f74ea 4%,
      #1d6ae0 8%,
      #1662d6 50%,
      #1454ba 90%,
      #0f45a8 100%
    );

<script>
console.log('=== LANDING PAGE SCRIPT STARTING ===');

// ===== SUPABASE CONFIGURATION =====
const SUPABASE_URL = 'https://aqlgkhfmlcayxjrltihr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_O6uFC-UAEYgDAve7mruEIg_gfXier-x';

let supabaseClient = null;
let currentUser = null;
let isAuthenticated = false;
let syncMode = false;
let dataLoaded = false; // saving stays blocked until the account's data has loaded

async function initSupabase() {
  try {
    // Wait for Supabase library to be available
    let attempts = 0;
    while (typeof window.supabase === 'undefined' && attempts < 50) {
      console.log('Waiting for Supabase library to load...');
      await new Promise(resolve => setTimeout(resolve, 100));
      attempts++;
    }

    if (typeof window.supabase === 'undefined') {
      console.error('❌ Supabase client library failed to load after 5 seconds');
      return false;
    }
    
    console.log('✓ Supabase library loaded');
    console.log('Creating Supabase client with:', SUPABASE_URL);
    
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log('✓ Supabase client created');

    // Fires when the session ends (logout elsewhere or a failed token refresh)
    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_OUT') showLoginScreen();
    });
    
    // Check if user is already logged in
    const { data, error } = await supabaseClient.auth.getSession();
    if (error) {
      console.error('Get session error:', error);
      return false;
    }
    
    if (data.session) {
      currentUser = data.session.user;
      isAuthenticated = true;
      syncMode = true;
      return true;
    }
    
    console.log('ℹ No active session');
    return false;
  } catch (error) {
    console.error('❌ Supabase init error:', error);
    return false;
  }
}

// ===== AUTH UI FUNCTIONS =====
function showAuthError(message) {
  const errorEl = document.getElementById('auth-error');
  errorEl.textContent = message;
  errorEl.classList.add('show');
  setTimeout(() => errorEl.classList.remove('show'), 5000);
}

function clearAuthError() {
  document.getElementById('auth-error').classList.remove('show');
}

let authBusy = false;

async function handleAuth() {
  if (authBusy) return;
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;

  if (!email || !password) {
    showAuthError('Email and password are required');
    return;
  }

  if (!supabaseClient) {
    showAuthError('Supabase not initialized. Refresh the page.');
    console.error('Supabase not initialized');
    return;
  }

  const authForm = document.getElementById('auth-form');
  const authLoading = document.getElementById('auth-loading');
  authBusy = true;
  authForm.style.display = 'none';
  authLoading.style.display = 'block';

  try {
    const result = await supabaseClient.auth.signInWithPassword({ email, password });
    if (result.error) throw result.error;

    if (result.data.user) {
      currentUser = result.data.user;
      isAuthenticated = true;
      syncMode = true;
      document.getElementById('auth-password').value = '';
      await enterApp();
    }
  } catch (error) {
    console.error('Auth error:', error);
    showAuthError(error.message || 'Authentication failed');
  } finally {
    authBusy = false;
    authForm.style.display = 'block';
    authLoading.style.display = 'none';
  }
}

async function enterApp() {
  document.getElementById('auth-container').classList.add('hidden');
  await loadUserData();
  render();
  await migrateLegacyLocalData();
}

// Wipes all in-memory account data and puts the login overlay back up
function showLoginScreen() {
  clearTimeout(syncTimer);
  currentUser = null;
  isAuthenticated = false;
  syncMode = false;
  dataLoaded = false;
  zones = [];
  settings = { ...DEFAULT_SETTINGS };
  applySettings(); syncSettingsUI(); render(); setSyncStatus('');
  closeSettings(); closeAllCtx();
  document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
  document.getElementById('auth-email').value = '';
  document.getElementById('auth-password').value = '';
  document.getElementById('auth-loading').style.display = 'none';
  document.getElementById('auth-form').style.display = 'block';
  document.getElementById('auth-container').classList.remove('hidden');
  document.getElementById('auth-email').focus();
}

async function handleLogout() {
  try { await flushSync(); }
  catch (error) {
    if (!confirm('Your latest changes could not be saved. Log out anyway?')) return;
  }
  if (supabaseClient) {
    try { await supabaseClient.auth.signOut(); }
    catch (error) { console.error('Logout error:', error); }
  }
  showLoginScreen();
}

// ===== DATA VALIDATION =====
// Everything that enters the app (database rows, imported files, old local data) goes through these.
const UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const HEX_COLOR = /^#[0-9a-f]{6}$/i;
const MAX_ZONES = 200;
const MAX_ICON_LENGTH = 250000;
const MAX_ICON_FILE_BYTES = 100 * 1024;

function clampInt(value, min, max, fallback) {
  if (value === null || value === undefined || value === '') return fallback;
  const n = Math.round(Number(value));
  return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
}

function safeHttpUrl(value) {
  const v = String(value ?? '').trim();
  if (!v || v.length > 2048) return '';
  try {
    const protocol = new URL(v).protocol;
    return protocol === 'http:' || protocol === 'https:' ? v : '';
  } catch { return ''; }
}

function safeIconUrl(value) {
  const v = String(value ?? '').trim();
  if (!v || v.length > MAX_ICON_LENGTH) return '';
  if (/^data:image\/(png|jpeg|gif|webp|svg\+xml);base64,/i.test(v)) return v;
  return safeHttpUrl(v);
}

function sanitizeSettings(raw) {
  const clean = { ...DEFAULT_SETTINGS };
  if (!raw || typeof raw !== 'object') return clean;
  for (const [key, [min, max]] of Object.entries(SETTING_LIMITS)) {
    clean[key] = clampInt(raw[key], min, max, DEFAULT_SETTINGS[key]);
  }
  for (const key of ['bgColor', 'surfaceColor', 'accentColor']) {
    if (typeof raw[key] === 'string' && HEX_COLOR.test(raw[key])) clean[key] = raw[key];
  }
  return clean;
}

function sanitizeZones(rawZones) {
  if (!Array.isArray(rawZones)) return [];
  const seen = new Set();
  const uniqueId = (candidate) => {
    const id = typeof candidate === 'string' && UUID_PATTERN.test(candidate) && !seen.has(candidate.toLowerCase())
      ? candidate : crypto.randomUUID();
    seen.add(id.toLowerCase());
    return id;
  };

  return rawZones.slice(0, MAX_ZONES).map(z => {
    if (!z || typeof z !== 'object') return null;
    const shortcuts = (Array.isArray(z.shortcuts) ? z.shortcuts : []).slice(0, 144).map(sc => {
      if (!sc || typeof sc !== 'object') return null;
      const url = safeHttpUrl(sc.url);
      if (!url) return null;
      return {
        id: uniqueId(sc.id),
        url,
        label: String(sc.label || labelFromUrl(url)).slice(0, 100),
        customIcon: safeIconUrl(sc.customIcon ?? sc.icon_url)
      };
    }).filter(Boolean);
    return {
      id: uniqueId(z.id),
      name: String(z.name || 'Untitled').slice(0, 100),
      cols: clampInt(z.cols, 1, 12, 3),
      rows: clampInt(z.rows, 1, 12, 2),
      shortcuts
    };
  }).filter(Boolean);
}

function settingsFromRow(row) {
  return sanitizeSettings({
    iconSize: row.icon_size, shortcutWidth: row.shortcut_width, labelSize: row.label_size,
    gridGap: row.grid_gap, zonePadding: row.zone_padding, zoneGap: row.zone_gap, zoneRadius: row.zone_radius,
    bgColor: row.bg_color, surfaceColor: row.surface_color, accentColor: row.accent_color
  });
}

function settingsToRow(userId) {
  return {
    user_id: userId,
    icon_size: settings.iconSize,
    shortcut_width: settings.shortcutWidth,
    label_size: settings.labelSize,
    grid_gap: settings.gridGap,
    zone_padding: settings.zonePadding,
    zone_gap: settings.zoneGap,
    zone_radius: settings.zoneRadius,
    bg_color: settings.bgColor,
    surface_color: settings.surfaceColor,
    accent_color: settings.accentColor
  };
}

// ===== SUPABASE DATA FUNCTIONS =====

async function loadUserData() {
  if (!isAuthenticated || !currentUser) return false;

  try {
    const userId = currentUser.id;
    const [zonesRes, shortcutsRes, settingsRes] = await Promise.all([
      supabaseClient.from('zones').select('*').eq('user_id', userId)
        .order('position', { ascending: true }).order('created_at', { ascending: true }),
      supabaseClient.from('shortcuts').select('*').eq('user_id', userId)
        .order('position', { ascending: true }).order('created_at', { ascending: true }),
      supabaseClient.from('user_settings').select('*').eq('user_id', userId).maybeSingle()
    ]);
    for (const res of [zonesRes, shortcutsRes, settingsRes]) {
      if (res.error) throw res.error;
    }

    const shortcutRows = shortcutsRes.data || [];
    zones = sanitizeZones((zonesRes.data || []).map(zone => ({
      ...zone,
      shortcuts: shortcutRows.filter(sc => sc.zone_id === zone.id)
    })));
    settings = settingsRes.data ? settingsFromRow(settingsRes.data) : { ...DEFAULT_SETTINGS };

    applySettings();
    syncSettingsUI();
    dataLoaded = true;
    setSyncStatus('');
    return true;
  } catch (error) {
    console.error('Load user data error:', error);
    dataLoaded = false;
    setSyncStatus('Load failed - reload');
    return false;
  }
}

// ===== SAVING =====
// Edits only change in-memory state; a debounced sync upserts everything.
// Deletes are sent explicitly. All database calls run one at a time, in order.
let syncTimer = null;
let dbQueue = Promise.resolve();
let changeSeq = 0;
let syncedSeq = 0;

function setSyncStatus(text) {
  const el = document.getElementById('xp-sync-status');
  if (el) el.textContent = text;
}

function enqueueDb(task) {
  const run = dbQueue.then(task);
  dbQueue = run.catch(() => {});
  return run;
}

function reportSyncError(error) {
  console.error('Database error:', error);
  setSyncStatus('Not saved!');
}

async function syncAll() {
  if (!isAuthenticated || !currentUser) return;
  const userId = currentUser.id;

  const zoneRows = zones.map((z, i) => ({ id: z.id, user_id: userId, name: z.name, cols: z.cols, rows: z.rows, position: i }));
  const shortcutRows = zones.flatMap(z => z.shortcuts.map((sc, i) => ({
    id: sc.id,
    user_id: userId,
    zone_id: z.id,
    url: sc.url,
    label: sc.label,
    icon_url: sc.customIcon || null,
    position: i
  })));

  // Zones first: shortcuts reference them
  if (zoneRows.length) {
    const { error } = await supabaseClient.from('zones').upsert(zoneRows);
    if (error) throw error;
  }
  if (shortcutRows.length) {
    const { error } = await supabaseClient.from('shortcuts').upsert(shortcutRows);
    if (error) throw error;
  }
  const { error } = await supabaseClient.from('user_settings').upsert(settingsToRow(userId));
  if (error) throw error;
}

async function flushSync() {
  clearTimeout(syncTimer);
  if (syncedSeq >= changeSeq) return;
  const seq = changeSeq;
  await enqueueDb(syncAll);
  syncedSeq = Math.max(syncedSeq, seq);
}

function queueSync() {
  if (!isAuthenticated || !dataLoaded) return;
  changeSeq++;
  setSyncStatus('Saving...');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    flushSync()
      .then(() => { if (syncedSeq >= changeSeq) setSyncStatus(''); })
      .catch(reportSyncError);
  }, 500);
}

function saveData() { queueSync(); }
function saveSettings() { queueSync(); }

window.addEventListener('beforeunload', (e) => {
  if (isAuthenticated && syncedSeq < changeSeq) { e.preventDefault(); e.returnValue = ''; }
});

function deleteZoneFromSupabase(zoneId) {
  if (!isAuthenticated || !currentUser) return;
  const userId = currentUser.id;
  enqueueDb(async () => {
    const { error } = await supabaseClient.from('zones').delete().eq('id', zoneId).eq('user_id', userId);
    if (error) throw error;
  }).catch(reportSyncError);
}

function deleteShortcutFromSupabase(shortcutId) {
  if (!isAuthenticated || !currentUser) return;
  const userId = currentUser.id;
  enqueueDb(async () => {
    const { error } = await supabaseClient.from('shortcuts').delete().eq('id', shortcutId).eq('user_id', userId);
    if (error) throw error;
  }).catch(reportSyncError);
}

// Removes the account's rows that are not in keepIds (used by import, which replaces everything)
async function deleteStaleRows(table, keepIds, userId) {
  const { data, error } = await supabaseClient.from(table).select('id').eq('user_id', userId);
  if (error) throw error;
  const keep = new Set(keepIds);
  const stale = data.map(row => row.id).filter(id => !keep.has(id));
  for (let i = 0; i < stale.length; i += 50) {
    const { error: deleteError } = await supabaseClient.from(table).delete()
      .in('id', stale.slice(i, i + 50)).eq('user_id', userId);
    if (deleteError) throw deleteError;
  }
}

async function replaceAllInSupabase() {
  const userId = currentUser.id;
  await enqueueDb(async () => {
    await syncAll();
    await deleteStaleRows('zones', zones.map(z => z.id), userId);
    await deleteStaleRows('shortcuts', zones.flatMap(z => z.shortcuts.map(sc => sc.id)), userId);
  });
}

// Data kept in this browser before login existed; offered once for upload, never rendered otherwise
const LEGACY_ZONES_KEY = 'landing_zones_v1';
const LEGACY_SETTINGS_KEY = 'landing_settings_v1';

async function migrateLegacyLocalData() {
  if (!dataLoaded || zones.length) return;
  let legacy;
  try { legacy = JSON.parse(localStorage.getItem(LEGACY_ZONES_KEY) || 'null'); } catch { return; }
  const legacyZones = sanitizeZones(legacy);
  if (!legacyZones.length) return;
  if (!confirm('Zones saved in this browser before login was added were found. Upload them to your account?')) return;

  zones = legacyZones;
  try {
    const legacySettings = JSON.parse(localStorage.getItem(LEGACY_SETTINGS_KEY) || 'null');
    if (legacySettings) { settings = sanitizeSettings(legacySettings); applySettings(); syncSettingsUI(); }
  } catch {}
  render();
  changeSeq++;
  try {
    await flushSync();
    localStorage.removeItem(LEGACY_ZONES_KEY);
    localStorage.removeItem(LEGACY_SETTINGS_KEY);
  } catch (error) { reportSyncError(error); }
}

const FAVICON_CACHE_KEY = 'landing_favicons_v1';

const DEFAULT_SETTINGS = {
  iconSize: 36, shortcutWidth: 72, labelSize: 10,
  gridGap: 4, zonePadding: 8, zoneGap: 24, zoneRadius: 8,
  bgColor: '#3a7a19', surfaceColor: '#ece9d8', accentColor: '#316ac5'
};
// [min, max] per numeric setting; matches the slider ranges and the database checks
const SETTING_LIMITS = {
  iconSize: [24, 64], shortcutWidth: [48, 120], labelSize: [8, 16],
  gridGap: [0, 16], zonePadding: [4, 32], zoneGap: [8, 48], zoneRadius: [0, 24]
};

let zones = [];
let settings = { ...DEFAULT_SETTINGS };
let faviconCache = loadFaviconCache();
let activeZoneId = null;
let editingZoneId = null;
let editingShortcut = null;
let scCtxTarget = null;

function loadFaviconCache() {
  try { const r = localStorage.getItem(FAVICON_CACHE_KEY); return r ? JSON.parse(r) : {}; }
  catch { return {}; }
}
function saveFaviconCache() {
  try { localStorage.setItem(FAVICON_CACHE_KEY, JSON.stringify(faviconCache)); }
  catch {} // quota exceeded — ignore
}
function fetchAndCacheFavicon(url, img) {
  const faviconUrl = getFaviconUrl(url);
  const tempImg = new Image();
  tempImg.crossOrigin = 'anonymous';
  tempImg.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = tempImg.naturalWidth || 64;
      canvas.height = tempImg.naturalHeight || 64;
      canvas.getContext('2d').drawImage(tempImg, 0, 0);
      const dataUrl = canvas.toDataURL('image/png');
      faviconCache[url] = dataUrl;
      saveFaviconCache();
      if (img && img.src !== dataUrl) img.src = dataUrl;
    } catch {} // canvas tainted by CORS — image still displays, just won't cache
  };
  tempImg.src = faviconUrl;
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function getFaviconUrl(url) {
  try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=64`; }
  catch { return ''; }
}

function labelFromUrl(url) {
  try { return new URL(url).hostname.replace(/^www\./, '').split('.')[0]; }
  catch { return 'Link'; }
}

function applySettings() {
  const r = document.documentElement.style;
  r.setProperty('--icon-size', settings.iconSize + 'px');
  r.setProperty('--shortcut-width', settings.shortcutWidth + 'px');
  r.setProperty('--label-size', settings.labelSize + 'px');
  r.setProperty('--grid-gap', settings.gridGap + 'px');
  r.setProperty('--zone-padding', settings.zonePadding + 'px');
  r.setProperty('--zone-gap', settings.zoneGap + 'px');
  r.setProperty('--zone-radius', settings.zoneRadius + 'px');
  r.setProperty('--bg', settings.bgColor);
  r.setProperty('--surface', settings.surfaceColor);
  r.setProperty('--accent', settings.accentColor);
}

function syncSettingsUI() {
  const map = {
    's-icon-size': ['iconSize', 'v-icon-size', 'px'],
    's-shortcut-width': ['shortcutWidth', 'v-shortcut-width', 'px'],
    's-label-size': ['labelSize', 'v-label-size', 'px'],
    's-grid-gap': ['gridGap', 'v-grid-gap', 'px'],
    's-zone-padding': ['zonePadding', 'v-zone-padding', 'px'],
    's-zone-gap': ['zoneGap', 'v-zone-gap', 'px'],
    's-zone-radius': ['zoneRadius', 'v-zone-radius', 'px'],
  };
  for (const [inputId, [key, valId, unit]] of Object.entries(map)) {
    document.getElementById(inputId).value = settings[key];
    document.getElementById(valId).textContent = settings[key] + unit;
  }

  document.getElementById('s-surface-color').value = settings.surfaceColor;

function bindSettingsInputs() {
  const rangeMap = {
    's-icon-size': 'iconSize', 's-shortcut-width': 'shortcutWidth',
    's-label-size': 'labelSize', 's-grid-gap': 'gridGap',
    's-zone-padding': 'zonePadding', 's-zone-gap': 'zoneGap',
    's-zone-radius': 'zoneRadius',
  };
  for (const [inputId, key] of Object.entries(rangeMap)) {
    document.getElementById(inputId).addEventListener('input', (e) => {
      settings[key] = parseInt(e.target.value);
      applySettings(); syncSettingsUI(); saveSettings(); render();
    });

  document.getElementById('s-bg-color').addEventListener('input', (e) => {
    settings.bgColor = e.target.value; applySettings(); saveSettings();
  });
  document.getElementById('s-surface-color').addEventListener('input', (e) => {

  });

}

document.getElementById('import-file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (!isAuthenticated || !dataLoaded) { alert('Log in and wait for your data to load before importing.'); return; }
  if (file.size > 5 * 1024 * 1024) { alert('That file is too large to be a backup.'); return; }

  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(reader.result); } catch { alert('Invalid JSON file.'); return; }
    const rawZones = Array.isArray(data) ? data : data?.zones;
    if (!Array.isArray(rawZones)) { alert('This file is not a valid backup.'); return; }

    const newZones = sanitizeZones(rawZones);
    const shortcutCount = newZones.reduce((n, z) => n + z.shortcuts.length, 0);
    if (!confirm(`Replace ALL your zones and shortcuts (including in the database) with ${newZones.length} zones and ${shortcutCount} shortcuts from this file?`)) return;

    zones = newZones;
    if (!Array.isArray(data) && data.settings) {
      settings = sanitizeSettings(data.settings);
      applySettings(); syncSettingsUI();
    }
    render();

    clearTimeout(syncTimer);
    const seq = ++changeSeq;
    setSyncStatus('Saving...');
    try {
      await replaceAllInSupabase();
      syncedSeq = Math.max(syncedSeq, seq);
      if (syncedSeq >= changeSeq) setSyncStatus('');
    } catch (error) {
      reportSyncError(error);
      alert('Imported, but saving to the database failed: ' + error.message);
    }
  };
  reader.readAsText(file);
});

function render() {
  const container = document.getElementById('zones-container');
  container.innerHTML = '';

  zones.forEach(zone => {
    const el = document.createElement('div');
    el.className = 'zone';
    el.dataset.id = zone.id;

    const header = document.createElement('div');
    header.className = 'zone-header';
    const title = document.createElement('input');
    title.className = 'zone-title';
    title.value = zone.name;
    title.spellcheck = false;
    title.maxLength = 30;
    title.addEventListener('change', () => { zone.name = title.value || 'Untitled'; saveData(); });

    const actions = document.createElement('div');
    actions.className = 'zone-actions';
    const moreBtn = document.createElement('button');
    moreBtn.textContent = '\u22EF';
    moreBtn.title = 'Zone options';
    moreBtn.addEventListener('click', (e) => { e.stopPropagation(); showCtxMenu(e.clientX, e.clientY, zone.id); });
    actions.appendChild(moreBtn);
    header.appendChild(title);
    header.appendChild(actions);
    el.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'zone-grid';
    grid.style.gridTemplateColumns = `repeat(${zone.cols}, var(--shortcut-width))`;

    zone.shortcuts.forEach((sc, idx) => {
      const a = document.createElement('a');
      a.className = 'shortcut';
      a.href = sc.url;
      a.title = sc.url;
      a.draggable = true;
      a.dataset.zoneId = zone.id;
      a.dataset.scIdx = idx;
      a.addEventListener('dragstart', onDragStart);
      a.addEventListener('dragover', onDragOver);
      a.addEventListener('drop', onDrop);

      const iconWrap = document.createElement('div');
      iconWrap.className = 'shortcut-icon';
      const img = document.createElement('img');
      const cachedSrc = sc.customIcon || faviconCache[sc.url];
      img.src = cachedSrc || getFaviconUrl(sc.url);
      img.alt = '';
      img.loading = 'eager';
      if (!cachedSrc) fetchAndCacheFavicon(sc.url, img);
      img.onerror = () => {
        img.style.display = 'none';
        iconWrap.textContent = sc.label[0]?.toUpperCase() || '?';
        iconWrap.style.fontSize = '16px';
        iconWrap.style.color = '#8892a4';
      };
      iconWrap.appendChild(img);

      const label = document.createElement('span');
      label.className = 'shortcut-label';
      label.textContent = sc.label;

      const optBtn = document.createElement('button');
      optBtn.className = 'shortcut-options-btn';
      optBtn.textContent = '\u22EF';
      optBtn.title = 'Options';
      optBtn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        showScCtxMenu(e.clientX, e.clientY, zone.id, idx);
      });

      a.appendChild(iconWrap);
      a.appendChild(label);
      a.appendChild(optBtn);
      grid.appendChild(a);
    });

    const maxSlots = zone.cols * zone.rows;
    if (zone.shortcuts.length < maxSlots) {
      const addBtn = document.createElement('button');
      addBtn.className = 'add-shortcut';
      addBtn.addEventListener('click', () => openShortcutModal(zone.id));
      const addIcon = document.createElement('div');
      addIcon.className = 'add-shortcut-icon';
      addIcon.textContent = '+';
      const addLabel = document.createElement('span');
      addLabel.className = 'add-shortcut-label';
      addLabel.textContent = 'Add';
      addBtn.appendChild(addIcon);
      addBtn.appendChild(addLabel);
      grid.appendChild(addBtn);
    }

    el.appendChild(grid);
    container.appendChild(el);
  });
}

let dragData = null;
function onDragStart(e) {
  dragData = { zoneId: e.currentTarget.dataset.zoneId, scIdx: parseInt(e.currentTarget.dataset.scIdx) };
  e.currentTarget.style.opacity = '0.4';
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function onDrop(e) {
  e.preventDefault();
  const toZoneId = e.currentTarget.dataset.zoneId;
  const toIdx = parseInt(e.currentTarget.dataset.scIdx);
  if (!dragData) return;
  const fromZone = zones.find(z => z.id === dragData.zoneId);
  const toZone = zones.find(z => z.id === toZoneId);
  if (!fromZone || !toZone) return;
  if (fromZone.id === toZone.id) {
    const [item] = fromZone.shortcuts.splice(dragData.scIdx, 1);
    fromZone.shortcuts.splice(toIdx > dragData.scIdx ? toIdx - 1 : toIdx, 0, item);
  } else {
    if (toZone.shortcuts.length >= toZone.cols * toZone.rows) return;
    const [item] = fromZone.shortcuts.splice(dragData.scIdx, 1);
    toZone.shortcuts.splice(toIdx, 0, item);
  }
  dragData = null; saveData(); render();
}
document.addEventListener('dragend', () => {
  dragData = null;
  document.querySelectorAll('.shortcut').forEach(el => el.style.opacity = '');
});

document.getElementById('shortcut-modal-confirm').addEventListener('click', () => {
  let url = document.getElementById('shortcut-url').value.trim();

  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  url = safeHttpUrl(url);
  if (!url) { alert('Enter a valid http(s) URL.'); return; }
  const label = (document.getElementById('shortcut-label').value.trim() || labelFromUrl(url)).slice(0, 100);
  const iconInput = document.getElementById('shortcut-icon-url').value.trim();
  const customIcon = safeIconUrl(iconInput);
  if (iconInput && !customIcon) { alert('Icon must be an http(s) image URL.'); return; }
  if (editingShortcut) {
    const zone = zones.find(z => z.id === editingShortcut.zoneId);
    if (zone && zone.shortcuts[editingShortcut.idx]) {
      const sc = zone.shortcuts[editingShortcut.idx];
      sc.url = url;
      sc.label = label;
      sc.customIcon = customIcon;
    }
    editingShortcut = null;
  } else {
    const zone = zones.find(z => z.id === activeZoneId);
    if (!zone || zone.shortcuts.length >= zone.cols * zone.rows) return;
    zone.shortcuts.push({ id: crypto.randomUUID(), url, label, customIcon });
  }
  saveData(); render(); closeModal('shortcut-modal');
});

  menu.style.left = x + 'px';

    if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 8) + 'px';
    if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 8) + 'px';

  // Try to initialize Supabase

function initClock() {
  const timeEl = document.getElementById('clock-time');
  const dateEl = document.getElementById('clock-date');
  const trayEl = document.getElementById('xp-tray-time');
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function tick() {
    const now = new Date();
    const h = now.getHours();
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 || 12;
    timeEl.textContent = `${h12}:${m}:${s} ${ampm}`;
    dateEl.textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    if (trayEl) trayEl.textContent = `${h12}:${m} ${ampm}`;
  }

  tick();
  setInterval(tick, 1000);
}

function initSearch() {
  const input = document.getElementById('search-input');

  input.addEventListener('input', () => applySearch(input.value.trim()));

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      input.value = '';
      applySearch('');
      input.blur();
    } else if (e.key === 'Enter') {
      const q = input.value.trim();
      if (!q) return;
      // Find first visible match
      const first = document.querySelector('.shortcut.search-match');
      if (first) {
        first.click();
      } else {
        // Fallback: web search
        const searchEngine = 'https://www.google.com/search?q=';
        window.location.href = searchEngine + encodeURIComponent(q);
      }
      input.value = '';
      applySearch('');
    }
  });

  // Focus search on '/' or letter keys outside of inputs
  document.addEventListener('keydown', (e) => {
    if (document.activeElement.tagName === 'INPUT') return;
    if (!document.getElementById('auth-container').classList.contains('hidden')) return;
    if (e.key === '/' || (/^[a-zA-Z0-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey)) {
      e.preventDefault();
      input.focus();
      if (e.key !== '/') { input.value = e.key; applySearch(e.key); }
    }
  });
}

function applySearch(q) {
  const shortcuts = document.querySelectorAll('.shortcut');
  if (!q) {
    shortcuts.forEach(el => { el.classList.remove('search-hidden', 'search-dim', 'search-match'); });
    return;
  }
  const lower = q.toLowerCase();
  let firstMatch = null;
  shortcuts.forEach(el => {
    const label = (el.querySelector('.shortcut-label')?.textContent || '').toLowerCase();
    const url = (el.title || '').toLowerCase();
    const matches = label.includes(lower) || url.includes(lower);
    el.classList.toggle('search-dim', !matches);
    el.classList.toggle('search-match', matches);
    el.classList.remove('search-hidden');
    if (matches && !firstMatch) firstMatch = el;
  });
}
</script>
